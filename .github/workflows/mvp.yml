name: MVP checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: viralcraft
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: viralcraft
        ports: ['55432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: npm ci
      - run: pip install -r apps/api/requirements.lock
      - run: python -m unittest discover -s apps/api/tests -v
        env:
          PYTHONPATH: apps/api
          LLM_PROVIDER: mock
          TEST_DATABASE_URL: postgresql://viralcraft:test-only-password@localhost:55432/viralcraft
      - run: npm run typecheck
      - run: npm run build:web
      - run: docker build -t viralcraft:ci .
      - run: docker run --rm viralcraft:ci python scripts/smoke_trial.py --renders 1
